name: check

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci needs package-lock.json to match package.json. Commit both together.
      - run: npm ci

      # typecheck + tests + content validation (same as running it locally)
      - run: npm run check

      # the production build must also work (includes the offline service worker)
      - run: npm run build
